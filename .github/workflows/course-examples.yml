name: Course Examples

# Compiles and runs every course code example (Java, C++, Python, JavaScript,
# NASM x86-64, Bash sessions and web pages) and checks its output against the recorded expected output.
on:
  pull_request:
    paths:
      - 'js/course-examples.js'
      - 'scripts/run_course_examples.js'
      - '.github/workflows/course-examples.yml'
  push:
    branches:
      - main
    paths:
      - 'js/course-examples.js'
      - 'scripts/run_course_examples.js'
  workflow_dispatch:

jobs:
  run-examples:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install NASM
        run: sudo apt-get update && sudo apt-get install -y nasm

      - name: Install Playwright Chromium (for the web page examples)
        run: npm ci && npx playwright install --with-deps chromium

      - name: Run every example
        run: node scripts/run_course_examples.js --jobs 4
