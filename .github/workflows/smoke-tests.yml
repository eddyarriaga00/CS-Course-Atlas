name: Smoke Tests

on:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:
    branches:
      - main

jobs:
  smoke:
    # Pinned: ubuntu-latest moved to 26.04, which this Playwright version cannot
    # install browsers on ("Playwright does not support chromium on ubuntu26.04").
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java (runs the Java predict-the-output challenges)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run frontend syntax check
        run: npm run check:frontend

      - name: Verify course curriculum
        run: npm run check:curriculum

      - name: Verify course examples (structure)
        run: npm run check:examples

      - name: Run smoke tests
        run: npm run test:smoke

